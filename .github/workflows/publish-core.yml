name: Publish core to npm

# Stages packages/core as @alihdrndm/blockpace-core when a tag like core-v0.2.0 is pushed.
# Uses npm trusted publishing: npm verifies this workflow through GitHub's OIDC token, so no
# npm token is stored as a secret. The trusted publisher on npmjs.com allows only
# `npm stage publish`, so nothing goes live until a maintainer approves the staged version
# with 2FA (on npmjs.com, or `npm stage approve` from a terminal).
on:
  push:
    tags: ["core-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          # No dependency cache in a release build: a poisoned cache must never reach npm.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches the package version
        working-directory: packages/core
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "core-v$version" ]; then
            echo "Tag $TAG does not match package version $version" >&2
            exit 1
          fi
      - run: pnpm --filter @alihdrndm/blockpace-core typecheck
      - run: pnpm --filter @alihdrndm/blockpace-core test
      - name: Stage the release (approve it on npmjs.com to publish)
        working-directory: packages/core
        run: npm stage publish --access public
