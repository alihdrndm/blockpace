version: 2

# Weekly update PRs, grouped so there are a few PRs a week instead of dozens.
# Security fixes arrive separately and immediately (Dependabot security updates).
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # NestJS 12, Node 24 and SST v3 majors are fixed by the project spec; major bumps
    # still open their own PR so they are reviewed one at a time.
    commit-message:
      prefix: "chore(deps)"

  # Keeps the SHA-pinned actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
