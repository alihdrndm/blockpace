packages:
  - packages/*
  - apps/*
# Install scripts that pnpm may run. None is needed: esbuild ships prebuilt binaries;
# cpu-features, protobufjs and ssh2 (pulled in by Testcontainers) work without their
# native or post-install steps; @scarf/scarf (pulled in by Swagger UI) only sends
# install analytics. Denying them keeps installs reproducible.
allowBuilds:
  esbuild: false
  cpu-features: false
  protobufjs: false
  ssh2: false
  "@scarf/scarf": false
# Fail locally, exactly like CI, when a new dependency brings an unreviewed build script,
# instead of only printing a warning that is easy to miss.
strictDepBuilds: true
